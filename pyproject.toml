[project]
name = "shield-data"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks/pipelines: spark, dbutils, display are injected; imports follow sys.path setup.
"notebooks/**" = ["F821", "E402", "E501", "B018"]
"pipelines/**" = ["F821", "E501"]
