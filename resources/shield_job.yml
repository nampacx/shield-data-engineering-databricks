resources:
  jobs:
    shield_daily:
      name: shield_daily_${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Berlin
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/databricks/10_maria_hill_schedules.py
            base_parameters:
              step: ingest
          max_retries: 2
        - task_key: silver
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/databricks/10_maria_hill_schedules.py
            base_parameters:
              step: silver
          max_retries: 2
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/databricks/10_maria_hill_schedules.py
            base_parameters:
              step: gold
          max_retries: 2
        - task_key: health_check
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/databricks/16_project_insight.py
