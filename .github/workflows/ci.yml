name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4 # PySpark (the rules-vs-Spark test) needs a JVM
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt pyspark
      - run: ruff check .
      - run: pytest -q

  bundle-validate:
    runs-on: ubuntu-latest
    needs: test
    # Needs repository secrets DATABRICKS_HOST and DATABRICKS_TOKEN (or switch to OIDC / a service principal).
    # Skipped on forks and until you add the secrets.
    if: ${{ vars.DATABRICKS_CI == 'true' }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev

  deploy-prod:
    runs-on: ubuntu-latest
    needs: bundle-validate
    if: ${{ github.ref == 'refs/heads/main' && vars.DATABRICKS_CI == 'true' }}
    environment: production # add required reviewers on this environment for a manual approval gate
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
